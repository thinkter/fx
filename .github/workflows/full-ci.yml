name: macOS fixture diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      AI_GATEWAY_API_KEY: ""
      VERCEL_OIDC_TOKEN: ""
      FX_REQUIRE_TMUX: "1"
      FX_E2E_DISABLE_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - uses: actions/cache/restore@v4
        with:
          path: .zig-cache
          key: fixture-diagnostic-${{ github.run_id }}
          restore-keys: setup-zig-cache-v2-native-zig-aarch64-macos-0.16.0-full-ci-native-macos-aarch64-ReleaseSafe-
      - run: zig build -Doptimize=ReleaseSafe
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: command -v tmux || brew install tmux
      - run: bun install --frozen-lockfile
        working-directory: tests/e2e
      - name: Trace permission input and committed frames
        run: bun test --preload ./fx-fixture-diagnostic-preload.ts --max-concurrency 1 --rerun-each 3 tests/e2e/tui-permissions.test.ts
